<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="signal-dot" id="signal-dot"></div>
      <h1>__MSG_popupTitle__</h1>
    </div>
    <p class="subtitle">__MSG_popupSubtitle__</p>

    <div class="divider"></div>

    <div class="toggle-row">
      <span class="label">__MSG_labelAutoplay__</span>
      <label class="switch" id="switch-label">
        <input type="checkbox" id="toggle-input">
        <span class="slider"></span>
      </label>
    </div>

    <div class="status-row">
      <span class="status-label">__MSG_labelStatus__</span>
      <span class="status-value" id="status">__MSG_statusChecking__</span>
    </div>

    <button id="test-btn">__MSG_btnTest__</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
