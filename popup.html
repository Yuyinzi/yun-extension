<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="signal-dot" id="signal-dot"></div>
      <h1 id="popup-title">Course Autoplay</h1>
    </div>
    <p class="subtitle" id="popup-subtitle">Auto-advance course videos</p>

    <div class="divider"></div>

    <div class="toggle-row">
      <span class="label" id="label-autoplay">Autoplay</span>
      <label class="switch" id="switch-label">
        <input type="checkbox" id="toggle-input">
        <span class="slider"></span>
      </label>
    </div>

    <div class="status-row">
      <span class="status-label" id="label-status">Status</span>
      <span class="status-value" id="status">checking...</span>
    </div>

  </div>
  <script src="popup.js"></script>
</body>
</html>
